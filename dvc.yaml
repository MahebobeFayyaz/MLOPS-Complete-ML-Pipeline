stages:

  data_ingestion:
    cmd: py src/data_ingestion.py
    deps:
      - src/data_ingestion.py
    params:
      - data_ingestion.test_size
    outs:
      - data/raw


  data_preprocessing:
    cmd: py src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - data/raw
    outs:
      - data/Interim


  feature_engineering:
    cmd: py src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/Interim
      - params.yaml
    params:
      - feature_engineering.max_features
    outs:
      - data/transformed


  model_building:
    cmd: py src/model_building.py
    deps:
      - src/model_building.py
      - data/transformed
      - params.yaml
    params:
      - model_building.n_estimators
      - model_building.random_state
    outs:
      - model/randomforest_model.pkl


  model_evaluation:
    cmd: py src/model_evaluation.py
    deps:
      - src/model_evaluation.py
      - data/transformed
      - model/randomforest_model.pkl
    metrics:
      - report/metrics.json